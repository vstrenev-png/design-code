    <style>
        .luxury-header-bar {
            background: #1a1a1a;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }
        .luxury-header-bar .logo {
            max-height: 40px;
        }
        .luxury-header-bar .menu-btn {
            width: 40px;
            height: 40px;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
        }
        .luxury-header-bar .menu-btn span {
            display: block;
            width: 25px;
            height: 2px;
            background: white;
            transition: all 0.3s ease;
        }
        .luxury-header-bar .menu-btn.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .luxury-header-bar .menu-btn.active span:nth-child(2) {
            opacity: 0;
        }
        .luxury-header-bar .menu-btn.active span:nth-child(3) {
            transform: rotate(-45deg) translate(7px, -6px);
        }
        body {
            padding-top: 70px;
        }
        .mobile-menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 26, 0.98);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }
        .mobile-menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .mobile-menu-overlay nav {
            display: flex;
            flex-direction: column;
            gap: 30px;
            text-align: center;
        }
        .mobile-menu-overlay nav a {
            color: white;
            text-decoration: none;
            font-size: 1.5em;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 300;
            transition: color 0.3s ease;
        }
        .mobile-menu-overlay nav a:hover {
            color: #8dc63f;
        }
    </style>
</head>

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');

        menuBtn.addEventListener('click', () => {
            menuBtn.classList.toggle('active');
            mobileMenu.classList.toggle('active');
        });

        mobileMenu.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                menuBtn.classList.remove('active');
                mobileMenu.classList.remove('active');
            });
        });
    </script>
